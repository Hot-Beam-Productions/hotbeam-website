name: Sync Firestore Snapshots

# Manual-only. Vercel auto-deploys on push and holds the app's env vars, but
# GitHub Actions has a SEPARATE secret store and can't read Vercel's variables.
# This job only refreshes the build-time fallbacks (data.json + metrics), which
# are a safety net (the live site/admin read Firestore at runtime). To run it,
# add NEXT_PUBLIC_FIREBASE_PROJECT_ID + NEXT_PUBLIC_FIREBASE_API_KEY as Actions
# secrets, or just refresh locally: npm run sync:fallback-admin (gcloud ADC).
on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: sync-firestore-snapshots
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Verify required secrets
        env:
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
        run: |
          missing=0
          for key in NEXT_PUBLIC_FIREBASE_PROJECT_ID NEXT_PUBLIC_FIREBASE_API_KEY; do
            if [ -z "${!key}" ]; then
              echo "::error::Missing required secret: $key"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Authenticate to Google Cloud for metrics sync
        id: google_auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/780032150745/locations/global/workloadIdentityPools/github-actions-pool/providers/hotbeam-website-github
          service_account: github-firestore-metrics@hot-beam-website.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/monitoring.read

      - name: Sync fallback JSON from Firestore
        env:
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
        run: npm run sync:fallback-json

      - name: Sync Firestore metrics snapshot
        env:
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          FIRESTORE_DATABASE_ID: "(default)"
          GCP_MONITORING_ACCESS_TOKEN: ${{ steps.google_auth.outputs.access_token }}
        run: npm run sync:firestore-metrics

      - name: Detect fallback changes
        id: changes
        run: |
          if git diff --quiet -- src/data/data.json src/data/firestore-metrics.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push fallback update
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/data.json src/data/firestore-metrics.json
          git commit -m "chore: sync firestore snapshots [skip ci]"
          git push
